<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive avatar</title>
  <style>
    :root { color-scheme: dark; --bg:#07080d; --card:#12141c; --line:#2a2e3a; --text:#f4f1ea; --muted:#a7a39a; --accent:#d7ff4a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: ui-sans-serif, system-ui, sans-serif; background: radial-gradient(1200px 600px at 70% -10%, #1c2433, var(--bg)); color: var(--text); }
    main { max-width: 980px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 18px; }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.03em; }
    .note { color: var(--muted); font-size: 0.92rem; margin: 6px 0 0; max-width: 62ch; }
    .stage { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 18px; }
    @media (max-width: 800px) { .stage { grid-template-columns: 1fr; } }
    .call { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 18px; display: grid; justify-items: center; gap: 12px; }
    .frame { width: min(100%, 280px); aspect-ratio: 3/4; border-radius: 36px; overflow: hidden; position: relative; background: #1a1d27; box-shadow: 0 0 0 1px #343846, 0 20px 50px rgba(0,0,0,.35); }
    .frame.speaking { box-shadow: 0 0 0 3px var(--accent), 0 20px 50px rgba(0,0,0,.35); }
    .frame img, .portrait { width: 100%; height: 100%; object-fit: cover; display: block; }
    .portrait { display: grid; place-items: end center; padding-bottom: 18px; font-size: 92px; }
    .maya { background: linear-gradient(160deg, #f3c7a5, #8d4b3a 70%); }
    .kai { background: linear-gradient(160deg, #c9d7ee, #3d5270 70%); }
    .aria { background: linear-gradient(160deg, #ead7ff, #5c4578 70%); }
    .status { font-size: 0.85rem; color: var(--muted); }
    .status b { color: var(--text); font-weight: 600; }
    .panel { background: rgba(18,20,28,.86); border: 1px solid var(--line); border-radius: 28px; padding: 16px; display: grid; gap: 12px; min-height: 420px; }
    .log { overflow: auto; max-height: 280px; display: grid; gap: 8px; align-content: start; }
    .bubble { padding: 10px 12px; border-radius: 16px; max-width: 92%; line-height: 1.4; }
    .user { justify-self: end; background: #243044; }
    .assistant { justify-self: start; background: #1b1e28; border: 1px solid var(--line); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .file { border: 1px solid var(--line); background: #191c26; color: var(--text); border-radius: 999px; padding: 8px 12px; cursor: pointer; font: inherit; }
    button.on, button.primary { background: var(--accent); color: #111; border-color: transparent; }
    button:disabled { opacity: .55; cursor: wait; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; border-radius: 999px; border: 1px solid var(--line); background: #0d0f15; color: var(--text); padding: 12px 14px; font: inherit; }
    .err { color: #ffb4b4; min-height: 1.2em; font-size: 0.85rem; }
    label.file input { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Interactive avatar</h1>
      <p class="note">This address is GitHub Pages. No Gemini key and no other secret is used. You can type or use the mic. The avatar answers out loud with your browser voice.</p>
    </header>
    <section class="stage">
      <div class="call">
        <div id="frame" class="frame">
          <div id="portrait" class="portrait maya" aria-hidden="true">M</div>
          <img id="photo" alt="" hidden />
        </div>
        <div class="status"><b id="who">Maya</b> · <span id="state">ready</span></div>
        <div class="row" id="avatars"></div>
        <label class="file">Upload photo<input id="file" type="file" accept="image/*" /></label>
      </div>
      <div class="panel">
        <div class="row" id="voices"></div>
        <div class="log" id="log"></div>
        <div class="err" id="err"></div>
        <form id="form">
          <input id="text" type="text" placeholder="Ask anything" autocomplete="off" />
          <button type="button" id="mic">Mic</button>
          <button class="primary" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    const avatars = [
      { id: "maya", name: "Maya", mark: "M" },
      { id: "kai", name: "Kai", mark: "K" },
      { id: "aria", name: "Aria", mark: "A" }
    ];
    const voices = [
      { id: "eve", label: "Eve", test: /female|samantha|victoria|zira|google uk english female/i },
      { id: "ara", label: "Ara", test: /female|karen|moira|susan/i },
      { id: "rex", label: "Rex", test: /male|daniel|alex|david|fred/i },
      { id: "sal", label: "Sal", test: /male|google uk english male|tom|rishi/i }
    ];
    const state = { avatar: avatars[0], voice: voices[0], busy: false, listening: false, messages: [] };
    const frame = document.querySelector("#frame");
    const portrait = document.querySelector("#portrait");
    const photo = document.querySelector("#photo");
    const who = document.querySelector("#who");
    const status = document.querySelector("#state");
    const log = document.querySelector("#log");
    const err = document.querySelector("#err");
    const text = document.querySelector("#text");
    const micBtn = document.querySelector("#mic");

    function setStatus(label, speaking) {
      status.textContent = label;
      frame.classList.toggle("speaking", speaking);
    }
    function add(role, content) {
      state.messages.push({ role, content });
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = content;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }
    function pickBrowserVoice() {
      const all = speechSynthesis.getVoices();
      return all.find((v) => state.voice.test.test(v.name)) || all.find((v) => v.lang.startsWith("en")) || all[0] || null;
    }
    function speak(content) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(content);
      const voice = pickBrowserVoice();
      if (voice) utter.voice = voice;
      utter.onstart = () => setStatus("speaking", true);
      utter.onend = () => setStatus("ready", false);
      utter.onerror = () => setStatus("ready", false);
      speechSynthesis.speak(utter);
    }
    async function reply(question) {
      const history = state.messages.slice(-6).map((m) => (m.role === "user" ? "Human: " : state.avatar.name + ": ") + m.content).join("\n");
      const prompt = "You are " + state.avatar.name + ", a calm video-call avatar. Answer the human in one or two short spoken sentences. No markdown.\n" + history + "\nHuman: " + question + "\n" + state.avatar.name + ":";
      const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt));
      if (!res.ok) throw new Error("Answer service returned " + res.status);
      const answer = (await res.text()).trim();
      if (!answer) throw new Error("Empty answer");
      return answer.slice(0, 700);
    }
    async function send(raw) {
      const content = raw.trim();
      if (!content || state.busy) return;
      err.textContent = "";
      text.value = "";
      add("user", content);
      state.busy = true;
      setStatus("thinking", false);
      try {
        const answer = await reply(content);
        add("assistant", answer);
        speak(answer);
      } catch (e) {
        const fallback = "I heard you, but the public answer service is unavailable right now. Try again in a moment.";
        add("assistant", fallback);
        err.textContent = e instanceof Error ? e.message : "Request failed";
        speak(fallback);
      } finally {
        state.busy = false;
        if (!speechSynthesis.speaking) setStatus("ready", false);
      }
    }
    document.querySelector("#avatars").innerHTML = avatars.map((a) => "<button type=\"button\" data-id=\"" + a.id + "\">" + a.name + "</button>").join("");
    document.querySelector("#voices").innerHTML = voices.map((v) => "<button type=\"button\" data-voice=\"" + v.id + "\">" + v.label + "</button>").join("");
    function paint() {
      who.textContent = state.avatar.name;
      portrait.textContent = state.avatar.mark;
      portrait.className = "portrait " + state.avatar.id;
      document.querySelectorAll("[data-id]").forEach((b) => b.classList.toggle("on", b.dataset.id === state.avatar.id));
      document.querySelectorAll("[data-voice]").forEach((b) => b.classList.toggle("on", b.dataset.voice === state.voice.id));
    }
    document.querySelector("#avatars").onclick = (ev) => {
      const id = ev.target.dataset && ev.target.dataset.id;
      if (!id) return;
      state.avatar = avatars.find((a) => a.id === id);
      photo.hidden = true;
      portrait.hidden = false;
      paint();
    };
    document.querySelector("#voices").onclick = (ev) => {
      const id = ev.target.dataset && ev.target.dataset.voice;
      if (!id) return;
      state.voice = voices.find((v) => v.id === id);
      paint();
    };
    document.querySelector("#file").onchange = (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      photo.src = url;
      photo.hidden = false;
      portrait.hidden = true;
    };
    document.querySelector("#form").onsubmit = (ev) => { ev.preventDefault(); send(text.value); };
    let rec = null;
    micBtn.onclick = () => {
      const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Ctor) { err.textContent = "This browser cannot capture speech. Type instead."; return; }
      if (state.listening && rec) { rec.stop(); return; }
      rec = new Ctor();
      rec.lang = "en-US";
      rec.interimResults = false;
      rec.onresult = (ev) => { const said = ev.results[0][0].transcript || ""; if (said.trim()) send(said); };
      rec.onerror = () => { state.listening = false; micBtn.classList.remove("on"); setStatus("ready", false); };
      rec.onend = () => { state.listening = false; micBtn.classList.remove("on"); if (!state.busy) setStatus("ready", false); };
      state.listening = true;
      micBtn.classList.add("on");
      setStatus("listening", false);
      rec.start();
    };
    speechSynthesis.onvoiceschanged = () => {};
    add("assistant", "I'm here. Ask me anything and I will answer out loud.");
    paint();
  </script>
</body>
</html>
